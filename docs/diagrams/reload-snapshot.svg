<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="580" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionFlag - config reload and pinned snapshots</text>
  <text class="subtitle" x="40" y="78">A reload builds a new snapshot and swaps it in whole; an invalid reload keeps the old one serving.</text>

  <!-- reload source -->
  <rect class="ext" x="40" y="190" width="200" height="80" rx="14"/>
  <text class="label" x="140" y="222" text-anchor="middle">Config reloads</text>
  <text class="small" x="140" y="244" text-anchor="middle">"OrionFlags" section changes</text>

  <path class="flow" d="M240,230 L288,230"/>

  <rect class="step" x="290" y="190" width="220" height="80" rx="14"/>
  <text class="code" x="400" y="224" text-anchor="middle">OnChange(options, name)</text>
  <text class="small" x="400" y="246" text-anchor="middle">IOptionsMonitor callback</text>

  <path class="flow" d="M510,230 L558,230"/>

  <!-- decision: default instance? -->
  <polygon class="decision" points="640,170 720,230 640,290 560,230"/>
  <text class="label" x="640" y="226" text-anchor="middle">name</text>
  <text class="label" x="640" y="246" text-anchor="middle">empty?</text>

  <path class="flow" d="M640,170 L640,140 L748,140"/>
  <text class="edge" x="652" y="160">no</text>
  <rect class="note" x="750" y="112" width="420" height="56" rx="10"/>
  <text class="small" x="770" y="136">Ignored: a named OrionFlagOptions instance never</text>
  <text class="small" x="770" y="156">replaces the snapshot of the default instance.</text>

  <path class="flow" d="M720,230 L778,230"/>
  <text class="edge" x="749" y="220" text-anchor="middle">yes</text>

  <rect class="step" x="780" y="190" width="220" height="80" rx="14"/>
  <text class="code" x="890" y="224" text-anchor="middle">FlagSnapshot.From</text>
  <text class="small" x="890" y="246" text-anchor="middle">freeze flags, validate rollouts</text>

  <path class="flow" d="M890,270 L890,308"/>

  <polygon class="decision" points="890,310 970,360 890,410 810,360"/>
  <text class="label" x="890" y="365" text-anchor="middle">valid?</text>

  <path class="flow" d="M970,360 L1018,360"/>
  <text class="edge" x="994" y="350" text-anchor="middle">yes</text>
  <rect class="ok" x="1020" y="325" width="150" height="70" rx="14"/>
  <text class="label" x="1095" y="355" text-anchor="middle">Swap in</text>
  <text class="small" x="1095" y="377" text-anchor="middle">volatile write</text>

  <path class="flow alt" d="M890,410 L890,448"/>
  <text class="edge" x="902" y="434">no</text>
  <rect class="fail" x="740" y="450" width="430" height="100" rx="14"/>
  <text class="label" x="955" y="480" text-anchor="middle">ArgumentException</text>
  <text class="small" x="955" y="502" text-anchor="middle">rollout without a flag, Percentage outside 0-100, or null Salt;</text>
  <text class="small" x="955" y="522" text-anchor="middle">thrown from the callback, the previous snapshot keeps serving</text>
  <text class="small" x="955" y="540" text-anchor="middle">(at startup the same check fails resolving IOrionFlags)</text>

  <!-- pinned snapshot -->
  <rect class="step" x="40" y="330" width="360" height="90" rx="14"/>
  <text class="code" x="220" y="362" text-anchor="middle">var snapshot = flags.GetSnapshot();</text>
  <text class="small" x="220" y="386" text-anchor="middle">pinned at the start of a request</text>
  <text class="small" x="220" y="406" text-anchor="middle">every check on it gives the same answer</text>

  <rect class="note" x="40" y="450" width="660" height="100" rx="10"/>
  <text class="small" x="60" y="480">After a swap, IsEnabled, IsEnabledFor and new GetSnapshot() calls read the new flags.</text>
  <text class="small" x="60" y="502">A snapshot already pinned never changes: it holds its own frozen flags and rollouts,</text>
  <text class="small" x="60" y="524">so a reload in the middle of a request cannot flip a decision inside it.</text>
</svg>
