<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; fill: #1e1b4b; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #475569; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 12.5px; fill: #475569; }
    .code { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 13px; fill: #3730a3; }
    .edge { font-size: 12.5px; fill: #334155; }
    .step { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    .ext { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
    .ok { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lane { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .flow.alt { stroke: #dc2626; stroke-dasharray: 6 4; marker-end: url(#arrow-fail); }
    .flow.back { stroke-dasharray: 6 4; }
    .badge { fill: #4f46e5; }
    .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="650" fill="#ffffff"/>

  <text class="title" x="40" y="52">OrionFlag - evaluating a flag</text>
  <text class="subtitle" x="40" y="78">A configured false always wins; a rollout only narrows a flag that is on, and only for IsEnabledFor.</text>

  <!-- start -->
  <rect class="step" x="40" y="160" width="230" height="80" rx="14"/>
  <text class="code" x="155" y="194" text-anchor="middle">IsEnabled(flag)</text>
  <text class="code" x="155" y="218" text-anchor="middle">IsEnabledFor(flag, subject)</text>

  <path class="flow" d="M270,200 L308,200"/>

  <!-- decision 1: configured? -->
  <polygon class="decision" points="390,140 470,200 390,260 310,200"/>
  <text class="label" x="390" y="196" text-anchor="middle">flag</text>
  <text class="label" x="390" y="216" text-anchor="middle">defined?</text>

  <path class="flow" d="M470,200 L538,200"/>
  <text class="edge" x="504" y="190" text-anchor="middle">yes</text>

  <!-- decision 2: enabled? -->
  <polygon class="decision" points="620,140 700,200 620,260 540,200"/>
  <text class="label" x="620" y="196" text-anchor="middle">configured</text>
  <text class="label" x="620" y="216" text-anchor="middle">true?</text>

  <path class="flow" d="M700,200 L768,200"/>
  <text class="edge" x="734" y="190" text-anchor="middle">yes</text>

  <!-- decision 3: rollout? -->
  <polygon class="decision" points="850,140 930,200 850,260 770,200"/>
  <text class="label" x="850" y="196" text-anchor="middle">rollout</text>
  <text class="label" x="850" y="216" text-anchor="middle">applies?</text>

  <path class="flow" d="M930,200 L1018,200"/>
  <text class="edge" x="974" y="172" text-anchor="middle">no rollout,</text>
  <text class="edge" x="974" y="190" text-anchor="middle">or IsEnabled</text>

  <rect class="ok" x="1020" y="170" width="150" height="60" rx="14"/>
  <text class="label" x="1095" y="206" text-anchor="middle">true</text>

  <!-- miss path -->
  <path class="flow alt" d="M390,260 L390,318"/>
  <text class="edge" x="402" y="294">no</text>
  <rect class="fail" x="225" y="320" width="300" height="90" rx="14"/>
  <text class="label" x="375" y="350" text-anchor="middle">DefaultWhenMissing</text>
  <text class="small" x="375" y="372" text-anchor="middle">default false: a typo fails closed</text>
  <text class="small" x="375" y="392" text-anchor="middle">IsEnabled(flag, defaultValue) serves defaultValue</text>

  <!-- kill switch -->
  <path class="flow alt" d="M620,260 L620,318"/>
  <text class="edge" x="632" y="294">no</text>
  <rect class="fail" x="535" y="320" width="170" height="70" rx="14"/>
  <text class="label" x="620" y="350" text-anchor="middle">false</text>
  <text class="small" x="620" y="372" text-anchor="middle">the kill switch wins</text>

  <!-- rollout path -->
  <path class="flow" d="M850,260 L850,318"/>
  <text class="edge" x="862" y="286">IsEnabledFor</text>
  <text class="edge" x="862" y="304">and a rollout</text>
  <rect class="step" x="720" y="320" width="260" height="80" rx="14"/>
  <text class="code" x="850" y="352" text-anchor="middle">SHA-256(name, salt, subject)</text>
  <text class="small" x="850" y="376" text-anchor="middle">bucket = first 8 bytes % 10000</text>

  <path class="flow" d="M850,400 L850,438"/>

  <polygon class="decision" points="850,440 960,500 850,560 740,500"/>
  <text class="label" x="850" y="496" text-anchor="middle">bucket &lt;</text>
  <text class="code" x="850" y="516" text-anchor="middle">Percentage * 100</text>

  <path class="flow" d="M960,500 L1018,500"/>
  <text class="edge" x="989" y="490" text-anchor="middle">yes</text>
  <rect class="ok" x="1020" y="470" width="150" height="60" rx="14"/>
  <text class="label" x="1095" y="506" text-anchor="middle">true</text>

  <path class="flow alt" d="M740,500 L662,500"/>
  <text class="edge" x="701" y="490" text-anchor="middle">no</text>
  <rect class="fail" x="480" y="465" width="180" height="70" rx="14"/>
  <text class="label" x="570" y="495" text-anchor="middle">false</text>
  <text class="small" x="570" y="517" text-anchor="middle">outside the cohort</text>

  <!-- note -->
  <rect class="note" x="40" y="580" width="1130" height="40" rx="10"/>
  <text class="small" x="60" y="605">Names are case-insensitive. Every outcome adds 1 to orion.flag.evaluations (flag, result, defined); the subject is hashed locally and never tagged.</text>
</svg>
